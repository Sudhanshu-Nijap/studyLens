services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studylens_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: studylens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: studylens_password
    ports:
      - "5433:5432"
    volumes:
      - studylens_pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studylens"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:latest
    container_name: studylens_postgrest
    restart: unless-stopped
    ports:
      - "8000:3000"
    environment:
      PGRST_DB_URI: "postgres://postgres:studylens_password@postgres:5432/studylens"
      PGRST_DB_SCHEMAS: "public"
      PGRST_DB_ANON_ROLE: "postgres"
      PGRST_OPENAPI_SERVER_PROXY_URI: "http://localhost:8000"
    depends_on:
      postgres:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    container_name: studylens_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - studylens_qdrant_data:/qdrant/storage

volumes:
  studylens_pgdata:
  studylens_qdrant_data:
